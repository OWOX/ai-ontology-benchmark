<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ui-token" content="{{UI_TOKEN}}">
<title>AI Ontology Hallucination Research</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <nav class="menu" aria-label="Pages">
    <h1>AI Ontology Hallucination Research</h1>
    <div class="release-pick">
      <select id="release" aria-label="Release"></select>
      <button id="refresh" type="button" class="small" title="Fetch from GitHub again" aria-label="Refresh">&#x21bb;</button>
    </div>
    <div id="links" class="links"></div>
    <p id="fetch-status" class="muted small"></p>
    <p id="fetch-error" class="msg err small" role="status"></p>
    <span id="conn" class="conn" title="Server">connecting</span>
  </nav>
  <div class="page">
    <main id="main"></main>
    <details class="termbox" id="termbox">
      <summary>Terminal</summary>
      <div class="term-bar"><strong>Jobs</strong><button id="btn-clear" type="button" class="small">Clear</button></div>
      <pre id="terminal" class="terminal" tabindex="0"></pre>
    </details>
  </div>
</div>
<script src="/static/cube.js"></script>
<script src="/static/markdown.js"></script>
<script src="/static/router.js"></script>
<script src="/static/progress.js"></script>
<script src="/static/cubepanel.js"></script>
<script src="/static/expmetrics.js"></script>
<script src="/static/pages/puzzles.js"></script>
<script src="/static/pages/inputs.js"></script>
<script src="/static/pages/experiments.js"></script>
<script src="/static/pages/experiment.js"></script>
<script src="/static/pages/models.js"></script>
<script src="/static/pages/about.js"></script>
</body>
</html>
