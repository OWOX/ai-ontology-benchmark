# Template for a first experiment, see docs/getting-started.md.
# Copy it to config/experiments/<experiment id>.toml before running.
# No API key and no spend. --estimate still prices it as a real model.
# Every attempt answers U, so the outcomes mean nothing. Run it with --no-commit.
release = "latest"
attempts = 1
retry_cap = 3
max_output_tokens = 32000
puzzles = ["2x2"]

[[models]]
name = "example-model"
provider = "fake"
api_model_id = "example-model-2026-01-01"
