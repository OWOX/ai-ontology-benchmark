# Model catalogue for the UI (python -m ui.server). Each entry has the same shape as a
# [[models]] entry in an experiment config, and the UI copies it unchanged.
# The providers cover LLM APIs and the decision-model APIs (typesafe, cloudflare).
# kind is system-1 or system-2, see docs/definitions.md#setups.
# Every model needs a row in config/prices.toml, or the UI shows it disabled.
# The reasoning effort comes from the experiment config (reasoning_effort), never from params.
# params is empty: since 2026-10-21 Anthropic rejects temperature, top_p, and top_k, and the
# reasoning models of the other providers fix their own sampling.

[[models]]
name = "claude-opus-5-5"
provider = "anthropic"
api_model_id = "claude-opus-5-5"
kind = "system-2"
params = {}

