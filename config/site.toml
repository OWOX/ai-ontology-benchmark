# The public results page (site/). Spec: docs/specs/site.md
title = "AI Ontology Benchmark"
description = "How AI models solve twisty puzzles, and how often they hallucinate a move"
intro = "To evaluate AI models without bias, we test them on ontologies of real-world objects. We use Rubik's cubes as the well-known source of legal moves, constraints and a criterion of success. Each model gets a scrambled cube and must either solve it or say it can't be solved. A script judges every answer, not a person or another AI, so the assessment is objective and the experiments are reproducible. The charts show how often models succeed, hallucinate by making illegal moves, and spot an impossible cube."
